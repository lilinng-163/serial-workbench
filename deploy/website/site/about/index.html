  <main id="main"><div class="container"><header class="page-heading"><h1>关于我</h1><p>我是 lilinng，主要做电子和嵌入式开发。</p></header><div class="about-grid"><div class="prose">
  <p>平时写嵌入式代码，也用 C / C++ 做工具，帮助自己调试设备。</p>
  <p>串口数据解析不对、波形挤成一团、AI 看不到设备现场，这些都是我在实际开发中遇到的问题。我会先把问题查清楚，再决定工具该怎么做。</p>
  <p>Serial Workbench 是我正在维护的调试工具，支持串口、波形、脚本、SSH 和 MCP。它的功能来自日常调试中碰到的需求。</p>
